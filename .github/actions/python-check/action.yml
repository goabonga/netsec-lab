name: python-check
description: Lint, type-check and test a single netsec-lab package.
inputs:
  path:
    description: Package directory (e.g. packages/netlab-dhcp)
    required: true
  module:
    description: Importable module name (e.g. netlab_dhcp)
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        # Per-package suffix: every check job resolves the same frozen
        # workspace, so a shared suffix makes all matrix legs race to
        # reserve one identical cache key ("Unable to reserve cache").
        # A distinct key per module lets each job own its own entry.
        cache-suffix: check-${{ inputs.module }}
        python-version: "3.11"
    - shell: bash
      run: |
        set -euo pipefail
        uv sync --frozen
        echo "::group::ruff"
        uv run --no-sync ruff check --output-format=github \
          "${{ inputs.path }}/src" "${{ inputs.path }}/tests"
        uv run --no-sync ruff format --check \
          "${{ inputs.path }}/src" "${{ inputs.path }}/tests"
        echo "::endgroup::"
        echo "::group::mypy"
        uv run --no-sync mypy "${{ inputs.path }}/src"
        echo "::endgroup::"
        echo "::group::pytest"
        uv run --no-sync --package "$(basename "${{ inputs.path }}")" \
          pytest "${{ inputs.path }}/tests" \
            --cov="${{ inputs.module }}" --cov-report=term-missing
        echo "::endgroup::"

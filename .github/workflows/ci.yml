      - netlab-vlan-typecheck
      - netlab-vlan-test
      - netlab-ipv6-ra-lint
      - netlab-ipv6-ra-typecheck
      - netlab-ipv6-ra-test
      - netlab-discovery-lint
      - netlab-discovery-typecheck
      - netlab-discovery-test
      - netlab-lldp-med-lint
      - netlab-lldp-med-typecheck
      - netlab-lldp-med-test
      - netlab-8021x-lint
      - netlab-8021x-typecheck
      - netlab-8021x-test
      - netlab-macsec-lint
      - netlab-macsec-typecheck
      - netlab-macsec-test
      - netlab-ipspoof-lint
      - netlab-ipspoof-typecheck
      - netlab-ipspoof-test
      - netlab-icmp-lint
      - netlab-icmp-typecheck
      - netlab-icmp-test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        run: |
          NAME="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          git config user.name "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --sign > /dev/null
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
            git config user.signingkey "$KEY_ID"; git config commit.gpgsign true
            echo "sign=--sign" >> "$GITHUB_OUTPUT"
          else
            echo "sign=" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - id: bump
        name: Bump, tag, push
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump --commit --tag --push ${{ steps.gpg.outputs.sign }} --output json)
          echo "bumped=$(echo "$PLAN" | jq -c '.bumps | keys')" >> "$GITHUB_OUTPUT"

  release-netlab-core:
    name: release (netlab-core)
    needs: [release-bump]
    if: >-
      !failure() && !cancelled()
      && contains(fromJson(needs.release-bump.outputs.bumped), 'netlab-core')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Build netlab-core
        run: uv build --package netlab-core --out-dir dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(uv tool run multicz get netlab-core)
          TAG="netlab-core-v$V"
          uv tool run multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - dist/*


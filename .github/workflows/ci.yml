# GENERATED by scripts/gen_ci.py from scripts/catalogue.py - do not edit by hand.
#
# No matrix: one explicit job per package per check, each gated on whether that
# component actually changed (multicz changed). The release fan-out bumps the
# workspace and creates a GitHub release per bumped package (+ the docs site).

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  detect:
    name: detect changed components
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Validate multicz configuration
        run: uv tool run multicz validate --strict
      - id: changed
        name: Compute changed components
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CH=$(uv tool run multicz changed --since "origin/${{ github.base_ref }}" --output json | jq -c '.changed')
          else
            CH=$(uv tool run multicz changed --output json | jq -c '.changed')
          fi
          echo "changed=$CH" >> "$GITHUB_OUTPUT"
          echo "## Changed: \`$CH\`" >> "$GITHUB_STEP_SUMMARY"

  headers:
    name: license-headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/add_license_header.py --path packages --types py --check
      - run: python3 scripts/add_license_header.py --path scripts --types py --check

  release-bump:
    name: release-bump
    needs:
      - detect
      - headers
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        run: |
          NAME="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          git config user.name "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --sign > /dev/null
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
            git config user.signingkey "$KEY_ID"; git config commit.gpgsign true
            echo "sign=--sign" >> "$GITHUB_OUTPUT"
          else
            echo "sign=" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - id: bump
        name: Bump, tag, push
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump --commit --tag --push ${{ steps.gpg.outputs.sign }} --output json)
          echo "bumped=$(echo "$PLAN" | jq -c '.bumps | keys')" >> "$GITHUB_OUTPUT"

  release-docs:
    name: release (docs)
    needs: [release-bump]
    if: >-
      !failure() && !cancelled()
      && contains(fromJson(needs.release-bump.outputs.bumped), 'docs')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical (doc group)
        run: uv sync --frozen --only-group doc
      - name: Build site
        run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

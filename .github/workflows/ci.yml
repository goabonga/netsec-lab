        run: uv tool install multicz
      - name: Build netlab-tempest
        run: uv build --package netlab-tempest --out-dir dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(uv tool run multicz get netlab-tempest)
          TAG="netlab-tempest-v$V"
          uv tool run multicz release-notes --tag "$TAG" \
            | gh release create "$TAG" --title "$TAG" --notes-file - dist/*

  release-docs:
    name: release (docs)
    needs: [release-bump]
    if: >-
      !failure() && !cancelled()
      && contains(fromJson(needs.release-bump.outputs.bumped), 'docs')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical (doc group)
        run: uv sync --frozen --only-group doc
      - name: Build site
        run: uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

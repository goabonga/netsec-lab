[project]
name = "netsec-lab"
version = "0.0.0"
description = "Hands-on network-security training: layered attack/detect/defend PoC (L2-L4 + network services), each an independent uv package, all replayable in isolated netns/veth labs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["network-security", "training", "poc", "scapy", "blue-team", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Security",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
netlab-wifi-recon = { workspace = true }
netlab-wifi-deauth = { workspace = true }
netlab-evil-twin = { workspace = true }
netlab-wpa-crack = { workspace = true }
netlab-wps-brute = { workspace = true }
netlab-tap = { workspace = true }
netlab-tempest = { workspace = true }
netlab-hw-implant = { workspace = true }
netlab-dhcp = { workspace = true }
netlab-arp = { workspace = true }
netlab-macflood = { workspace = true }
netlab-stp = { workspace = true }
netlab-vlan = { workspace = true }
netlab-ipv6-ra = { workspace = true }
netlab-core = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "scapy>=2.5",
    "netlab-wifi-recon",
    "netlab-wifi-deauth",
    "netlab-evil-twin",
    "netlab-wpa-crack",
    "netlab-wps-brute",
    "netlab-tap",
    "netlab-tempest",
    "netlab-hw-implant",
    "netlab-dhcp",
    "netlab-arp",
    "netlab-macflood",
    "netlab-stp",
    "netlab-vlan",
    "netlab-ipv6-ra",
    "netlab-core",
]
doc = ["zensical", "markdown>=3.7"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "PL", "RUF"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR2004"]
"scripts/**" = ["S", "PLR", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages"]
exclude = ["(^|/)tests/"]
explicit_package_bases = true

[tool.bandit]
skips = ["B404", "B603", "B607"]

[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true

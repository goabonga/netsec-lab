# multicz.toml - per-component versioning, changelogs and tags for the
# netsec-lab workspace. Driven by Conventional Commits.
# Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[[project.changelog_sections]]
title = "Documentation"
types = ["docs"]

[components.docs]
paths = ["docs/**", "zensical.toml"]
depends_on = ["netlab-core", "netlab-wifi-recon", "netlab-wifi-deauth", "netlab-evil-twin", "netlab-wpa-crack", "netlab-wps-brute", "netlab-tap", "netlab-tempest", "netlab-hw-implant", "netlab-dhcp", "netlab-arp", "netlab-macflood", "netlab-stp", "netlab-vlan", "netlab-ipv6-ra", "netlab-discovery", "netlab-lldp-med", "netlab-8021x", "netlab-macsec", "netlab-ipspoof", "netlab-icmp", "netlab-frag", "netlab-routing", "netlab-igmp", "netlab-bgp", "netlab-vrrp-hsrp", "netlab-portscan", "netlab-synflood", "netlab-tcphijack", "netlab-amplif", "netlab-ids-evasion", "netlab-covert", "netlab-dns", "netlab-dnstunnel", "netlab-icmptunnel", "netlab-tls", "netlab-snmp", "netlab-ntp", "netlab-mdns-llmnr", "netlab-kerberos-net", "netlab-quic", "netlab-ids", "netlab-firewall", "netlab-netflow", "netlab-pcap-forensics", "netlab-tls-inspect", "netlab-macsec-monitor"]
changelog = "docs/CHANGELOG.md"
bump_files = [
    { file = "zensical.toml", key = "project.extra.versions.docs" },
]
# Merges into `[project.bump_rules]`: adds `docs` on top of the inherited
# feat/fix/perf/revert. A `docs:` commit therefore bumps the site (patch)
# and redeploys it, while the packages - which inherit the project rules
# where `docs` is absent - stay untouched by a docs-only change.
bump_rules = { docs = "patch" }

[components.netlab-core]
paths = ["packages/netlab-core/**"]
changelog = "packages/netlab-core/CHANGELOG.md"
bump_files = [
    { file = "packages/netlab-core/pyproject.toml", key = "project.version" },
    { file = "packages/netlab-core/src/netlab_core/__version__.py", key = "regex:__version__\\s*=\\s*[\"\x27]([^\"\x27]+)[\"\x27]" },
    { file = "zensical.toml", key = "project.extra.versions.netlab_core" },
]
post_bump = ["uv lock"]


# multicz.toml - per-component versioning, changelogs and tags for the
# netsec-lab workspace. Driven by Conventional Commits.
# Docs: https://goabonga.github.io/multicz/

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
post_bump_policy = "allow"
state_file = ".multicz/state.json"

[project.bump_rules]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[[project.changelog_sections]]
title = "Added"
types = ["feat"]

[[project.changelog_sections]]
title = "Fixed"
types = ["fix"]

[[project.changelog_sections]]
title = "Performance"
types = ["perf"]

[components.docs]
paths = ["docs/**", "zensical.toml"]
depends_on = ["netlab-core", "netlab-wifi-recon", "netlab-wifi-deauth", "netlab-evil-twin", "netlab-wpa-crack", "netlab-wps-brute", "netlab-tap", "netlab-tempest", "netlab-hw-implant", "netlab-dhcp", "netlab-arp", "netlab-macflood", "netlab-stp", "netlab-vlan", "netlab-ipv6-ra", "netlab-discovery", "netlab-lldp-med", "netlab-8021x", "netlab-macsec", "netlab-ipspoof"]
changelog = "docs/CHANGELOG.md"
bump_files = [
    { file = "zensical.toml", key = "project.extra.versions.docs" },
]

[components.netlab-core]
paths = ["packages/netlab-core/**"]
changelog = "packages/netlab-core/CHANGELOG.md"
bump_files = [
    { file = "packages/netlab-core/pyproject.toml", key = "project.version" },
    { file = "packages/netlab-core/src/netlab_core/__version__.py", key = "regex:__version__\\s*=\\s*[\"\x27]([^\"\x27]+)[\"\x27]" },
    { file = "zensical.toml", key = "project.extra.versions.netlab_core" },
]
post_bump = ["uv lock"]


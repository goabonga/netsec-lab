# Zensical site config. The per-layer sections and per-PoC pages are added to
# the nav by scripts/gen_docs.py --zensical as modules land.

[project]
site_name = "netsec-lab"
site_description = "Hands-on network-security training: layered attack/detect/defend PoC."
site_author = "Chris"
site_url = "https://goabonga.github.io/netsec-lab/"
repo_url = "https://github.com/goabonga/netsec-lab"
repo_name = "goabonga/netsec-lab"
nav = [
    { "Introduction" = "index.md" },
    { "Lab setup" = "lab-setup.md" },
    { "Methodology" = "methodology.md" },
    { 'Layer 1 - Physical' = [{ "Overview" = "layer-1-physical/index.md" }, { '802.11 passive reconnaissance' = "layer-1-physical/wifi-recon.md" }, { '802.11 deauthentication' = "layer-1-physical/wifi-deauth.md" }, { 'Evil twin / rogue AP' = "layer-1-physical/evil-twin.md" }, { 'WPA/WPA2 handshake & PMKID crack' = "layer-1-physical/wpa-crack.md" }, { 'WPS PIN brute force' = "layer-1-physical/wps-brute.md" }, { 'Passive network tapping' = "layer-1-physical/network-tapping.md" }, { 'TEMPEST / Van Eck emanations' = "layer-1-physical/tempest.md" }, { 'Rogue hardware implant' = "layer-1-physical/hardware-implant.md" }] },
    { 'Layer 2 - Data Link' = [{ "Overview" = "layer-2-link/index.md" }, { 'DHCP snooping' = "layer-2-link/dhcp.md" }, { 'ARP spoofing' = "layer-2-link/arp.md" }, { 'MAC flooding (CAM overflow)' = "layer-2-link/mac-flooding.md" }, { 'STP root takeover' = "layer-2-link/stp.md" }, { 'VLAN hopping' = "layer-2-link/vlan-hopping.md" }, { 'Rogue Router Advertisement (IPv6)' = "layer-2-link/ipv6-ra.md" }, { 'CDP/LLDP enumeration' = "layer-2-link/discovery-cdp-lldp.md" }, { 'LLDP-MED abuse' = "layer-2-link/lldp-med.md" }, { 'NAC bypass (802.1X)' = "layer-2-link/8021x.md" }, { 'MACsec / MKA' = "layer-2-link/macsec.md" }] },
    { 'Layer 3 - Network' = [{ "Overview" = "layer-3-network/index.md" }, { 'IP spoofing' = "layer-3-network/ip-spoofing.md" }, { 'ICMP redirect & tunneling' = "layer-3-network/icmp.md" }, { 'Fragmentation & IDS evasion' = "layer-3-network/fragmentation.md" }, { 'Routing injection (RIP/OSPF)' = "layer-3-network/routing.md" }, { 'IGMP snooping / spoofing' = "layer-3-network/igmp-multicast.md" }, { 'BGP hijack (simulated)' = "layer-3-network/bgp-hijack.md" }, { 'FHRP takeover (VRRP/HSRP)' = "layer-3-network/vrrp-hsrp.md" }] },
    { 'Layer 4 - Transport' = [{ "Overview" = "layer-4-transport/index.md" }, { 'Port scanning & fingerprinting' = "layer-4-transport/port-scanning.md" }, { 'TCP SYN flood' = "layer-4-transport/syn-flood.md" }, { 'TCP session hijacking' = "layer-4-transport/tcp-hijacking.md" }, { 'Reflection & amplification' = "layer-4-transport/amplification.md" }, { 'NIDS evasion (insertion/evasion)' = "layer-4-transport/ids-evasion.md" }, { 'Covert channels' = "layer-4-transport/covert-channels.md" }] },
    { 'Network Services' = [{ "Overview" = "network-services/index.md" }, { 'DNS spoofing / cache poisoning' = "network-services/dns-spoofing.md" }, { 'DNS tunneling' = "network-services/dns-tunneling.md" }, { 'ICMP tunneling' = "network-services/icmp-tunneling.md" }, { 'TLS downgrade / MITM' = "network-services/tls.md" }, { 'SNMP enumeration' = "network-services/snmp.md" }, { 'NTP time-shift MITM' = "network-services/ntp.md" }, { 'mDNS/LLMNR/NBT-NS poisoning' = "network-services/mdns-llmnr.md" }, { 'Kerberos on the wire' = "network-services/kerberos-net.md" }, { 'QUIC / HTTP3 fingerprinting' = "network-services/quic.md" }] },
    { 'Defensive Tooling' = [{ "Overview" = "defensive-tooling/index.md" }, { 'IDS rule harness' = "defensive-tooling/ids.md" }, { 'Firewall policy' = "defensive-tooling/firewall.md" }, { 'NetFlow / IPFIX analysis' = "defensive-tooling/netflow.md" }, { 'PCAP forensics' = "defensive-tooling/pcap-forensics.md" }, { 'TLS inspection proxy' = "defensive-tooling/tls-inspect.md" }, { 'MACsec posture check' = "defensive-tooling/macsec-monitor.md" }] },
    { "Versions" = "versions.md" },
]

# Declaring this table overrides zensical's DEFAULT_MARKDOWN_EXTENSIONS wholesale,
# so the full default set is restored verbatim here (fenced code blocks need
# pymdownx.superfences + pymdownx.highlight) and the `macros` extension is added.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
"zensical.extensions.macros" = {}

# Per-component versions surfaced on docs/versions.md through the
# `macros` extension ({{ config.extra.versions.* }}). multicz rewrites
# each value on bump: every component lists the matching key in its
# `bump_files` (see multicz.toml), and the `docs` component `depends_on`
# them all so this page is regenerated whenever any version changes.
#
# NOTE: keys use underscores (netlab_dhcp, not netlab-dhcp) - a dash reads
# as subtraction inside the Jinja `{{ ... }}` macro expression.
[project.extra.versions]
docs = "0.1.0"
netlab_core = "0.0.0"
netlab_wifi_recon = "0.1.0"
netlab_wifi_deauth = "0.1.0"
netlab_evil_twin = "0.1.0"

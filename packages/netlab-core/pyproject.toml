[project]
name = "netlab-core"
version = "0.0.0"
description = "Socle partagé des PoC de sécurité réseau netsec-lab : garde-fou de consentement, lab netns/veth, capture scapy, binding table, journalisation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["network-security", "training", "poc", "scapy", "netns"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
capture = ["scapy>=2.5"]

[project.urls]
Homepage = "https://github.com/goabonga/netsec-lab"
Source = "https://github.com/goabonga/netsec-lab/tree/main/packages/netlab-core"
Issues = "https://github.com/goabonga/netsec-lab/issues"
Changelog = "https://github.com/goabonga/netsec-lab/blob/main/packages/netlab-core/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlab_core"]

[tool.hatch.build.targets.sdist]
include = ["src/netlab_core", "tests", "README.md", "CHANGELOG.md"]

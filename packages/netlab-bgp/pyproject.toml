[project]
name = "netlab-bgp"
version = "0.0.0"
description = "netsec-lab L3 PoC: BGP hijack (simulated). Hijack a prefix in a lab AS mesh - flagship module."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["network-security", "training", "poc", "bgp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Security",
]
dependencies = ["netlab-core"]

[project.optional-dependencies]
capture = ["scapy>=2.5"]

[project.scripts]
netlab-bgp = "netlab_bgp.cli:main"

[project.urls]
Homepage = "https://github.com/goabonga/netsec-lab"
Source = "https://github.com/goabonga/netsec-lab/tree/main/packages/netlab-bgp"
Issues = "https://github.com/goabonga/netsec-lab/issues"
Changelog = "https://github.com/goabonga/netsec-lab/blob/main/packages/netlab-bgp/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlab_bgp"]

[tool.hatch.build.targets.sdist]
include = ["src/netlab_bgp", "tests", "README.md", "CHANGELOG.md"]

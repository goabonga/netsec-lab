[project]
name = "netlab-ipv6-ra"
version = "0.1.0"
description = "netsec-lab L2 PoC: Rogue Router Advertisement (IPv6). The IPv6 equivalent of rogue DHCP: forge RA/SLAAC messages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["network-security", "training", "poc", "ipv6-ra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Security",
]
dependencies = ["netlab-core"]

[project.optional-dependencies]
capture = ["scapy>=2.5"]

[project.scripts]
netlab-ipv6-ra = "netlab_ipv6_ra.cli:main"

[project.urls]
Homepage = "https://github.com/goabonga/netsec-lab"
Source = "https://github.com/goabonga/netsec-lab/tree/main/packages/netlab-ipv6-ra"
Issues = "https://github.com/goabonga/netsec-lab/issues"
Changelog = "https://github.com/goabonga/netsec-lab/blob/main/packages/netlab-ipv6-ra/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlab_ipv6_ra"]

[tool.hatch.build.targets.sdist]
include = ["src/netlab_ipv6_ra", "tests", "README.md", "CHANGELOG.md"]
